<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>TikTok — code d'autorisation</title>
<style>
  body { font-family: -apple-system, sans-serif; background:#0d0d14; color:#fff; display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; padding:20px; box-sizing:border-box; }
  .card { max-width:600px; background:#1a1a24; border:1px solid #2e2e3a; border-radius:12px; padding:32px; }
  h1 { color:#d4af37; font-size:20px; margin-top:0; }
  code { display:block; background:#0d0d14; border:1px solid #2e2e3a; border-radius:8px; padding:16px; word-break:break-all; font-size:14px; margin:16px 0; user-select:all; }
  button { background:#b24bf3; color:#fff; border:none; border-radius:8px; padding:10px 18px; font-size:14px; cursor:pointer; }
  .empty { color:#999; }
</style>
</head>
<body>
  <div class="card">
    <h1>Code d'autorisation TikTok</h1>
    <div id="content"><p class="empty">Aucun code trouvé dans l'URL.</p></div>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');
    const error = params.get('error');
    const target = document.getElementById('content');
    if (code) {
      target.innerHTML = '<p>Copie ce code et envoie-le :</p><code id="code">' + code + '</code><button onclick="navigator.clipboard.writeText(document.getElementById(\'code\').textContent)">Copier</button>';
    } else if (error) {
      target.innerHTML = '<p class="empty">Erreur renvoyée par TikTok : ' + error + '</p>';
    }
  </script>
</body>
</html>
